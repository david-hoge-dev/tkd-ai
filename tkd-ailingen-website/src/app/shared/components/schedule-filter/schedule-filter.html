<div class="schedule-filter">
  <div class="filter-controls">
    <!-- Program Type Filter -->
    <mat-form-field appearance="outline" class="program-filter">
      <mat-label>Kurse</mat-label>
      <mat-select
        [value]="filters().programType"
        (selectionChange)="onProgramTypeChange($any($event).value)"
        [attr.data-testid]="'program-type-filter'">
        @for (option of programTypeOptions; track option.value) {
          <mat-option [value]="option.value">
            {{ option.label }}
          </mat-option>
        }
      </mat-select>
    </mat-form-field>

    <!-- Search Filter -->
    <mat-form-field appearance="outline" class="search-filter">
      <mat-label>Suche</mat-label>
      <input
        matInput
        [value]="filters().searchText"
        (input)="onSearchChange($any($event.target).value)"
        placeholder="Nach Level, Tag, Uhrzeit suchen..."
        [attr.data-testid]="'search-filter'" />
      @if (filters().searchText) {
        <button
          matSuffix
          mat-icon-button
          (click)="onSearchChange('')"
          aria-label="Suche löschen">
          <mat-icon>close</mat-icon>
        </button>
      }
    </mat-form-field>

    <!-- Clear All Button -->
    @if (hasActiveFilters) {
      <button
        mat-stroked-button
        (click)="clearFilters()"
        class="clear-filters-btn"
        [attr.data-testid]="'clear-filters-button'">
        <mat-icon>filter_alt_off</mat-icon>
        Filter zurücksetzen
      </button>
    }
  </div>
</div>
