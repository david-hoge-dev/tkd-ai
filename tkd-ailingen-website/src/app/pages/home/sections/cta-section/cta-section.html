<section class="cta-section">
  <div class="container">
    <h2 class="section-title">Bereit zum Einstieg?</h2>
    <p class="section-description">Vereinbare jetzt ein kostenloses Probetraining oder kontaktiere uns für weitere Informationen.</p>

    <div class="cta-buttons">
      @for (button of buttons; track button.id) {
        <button
          mat-raised-button
          [color]="button.buttonStyle"
          [class]="'cta-button cta-button-' + button.buttonStyle"
          (click)="onCTAClick(button)"
          [attr.aria-label]="button.ariaLabel || button.label">
          @if (button.icon) {
            <mat-icon>{{ button.icon }}</mat-icon>
          }
          {{ button.label }}
        </button>
      }
    </div>
  </div>
</section>
